name: musicbrainz-picard@3

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep -m 1 'version' Casks/musicbrainz-picard@3.rb | cut -d '"' -f 2)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest 3.x prerelease and download URLs
        id: fetch-release
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.PAT }}" "https://api.github.com/repos/metabrainz/picard/releases")
          # Filter for prereleases with tags starting with release-3. through release-9.*
          RELEASE=$(echo "$RELEASE_INFO" | jq -c '[.[] | select(.draft == false and .prerelease == true and (.tag_name | test("^release-[3-9]\\.")))] | sort_by(.created_at) | last')
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          VERSION=$(echo "$TAG" | sed 's/^release-//')
          ARM_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("MusicBrainz-Picard-.*-macOS-13\\.0-arm64\\.dmg$")) | .browser_download_url' | head -n 1)
          INTEL_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("MusicBrainz-Picard-.*-macOS-13\\.0-x86_64\\.dmg$")) | .browser_download_url' | head -n 1)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ] || [ -z "$ARM_URL" ] || [ "$ARM_URL" = "null" ] || [ -z "$INTEL_URL" ] || [ "$INTEL_URL" = "null" ]; then
            echo "Error: Invalid 3.x prerelease metadata detected. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "arm_url=" >> $GITHUB_OUTPUT
            echo "intel_url=" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arm_url=$ARM_URL" >> $GITHUB_OUTPUT
          echo "intel_url=$INTEL_URL" >> $GITHUB_OUTPUT

      - name: Download and calculate SHA256
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: download
        run: |
          ARM_URL="${{ steps.fetch-release.outputs.arm_url }}"
          INTEL_URL="${{ steps.fetch-release.outputs.intel_url }}"

          ARM_SHA256=$(curl -sL "$ARM_URL" | sha256sum | cut -d ' ' -f 1)
          INTEL_SHA256=$(curl -sL "$INTEL_URL" | sha256sum | cut -d ' ' -f 1)

          echo "arm_sha256=$ARM_SHA256" >> $GITHUB_OUTPUT
          echo "intel_sha256=$INTEL_SHA256" >> $GITHUB_OUTPUT

      - name: Delete old branches
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          git branch -r | grep 'origin/musicbrainz-picard@3-' | while read -r branch; do
            branch=${branch#origin/}
            git push origin --delete "$branch"
          done || true
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Update Cask and README
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          ARM_SHA256="${{ steps.download.outputs.arm_sha256 }}"
          INTEL_SHA256="${{ steps.download.outputs.intel_sha256 }}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ] || [ -z "$ARM_SHA256" ] || [ "$ARM_SHA256" = "null" ] || [ -z "$INTEL_SHA256" ] || [ "$INTEL_SHA256" = "null" ]; then
            echo "Error: Missing version or checksum. Aborting update." >&2
            exit 1
          fi

          VERSION="$VERSION" perl -i -pe 's/^(\s*version\s+)".+?"/$1"$ENV{VERSION}"/' "Casks/musicbrainz-picard@3.rb"
          ARM_SHA256="$ARM_SHA256" sed -i "/on_arm do/,/end/ s/sha256 \".*\"/sha256 \"${ARM_SHA256}\"/" "Casks/musicbrainz-picard@3.rb"
          INTEL_SHA256="$INTEL_SHA256" sed -i "/on_intel do/,/end/ s/sha256 \".*\"/sha256 \"${INTEL_SHA256}\"/" "Casks/musicbrainz-picard@3.rb"
          VERSION="$VERSION" perl -i -pe 's/(\| `musicbrainz-picard@3`\s+\| `)([^`]*)(`\s*\|)/$1$ENV{VERSION}$3/ if /musicbrainz-picard@3/' README.md

      - name: Create Pull Request
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update musicbrainz-picard@3 to version ${{ steps.fetch-release.outputs.version }}"
          title: "Update musicbrainz-picard@3 to version ${{ steps.fetch-release.outputs.version }}"
          body: |
            Automated update of musicbrainz-picard@3 to version ${{ steps.fetch-release.outputs.version }}

            - Updated version to ${{ steps.fetch-release.outputs.version }}
            - Updated SHA256 checksums for both ARM and Intel builds
            - Validated download assets at ${{ steps.fetch-release.outputs.arm_url }} and ${{ steps.fetch-release.outputs.intel_url }}
            - Updated version in README.md
          branch: musicbrainz-picard@3-${{ steps.fetch-release.outputs.version }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: ((steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch') && steps.cpr.outputs.pull-request-number
        run: |
          # Wait for status checks to complete (max 2 minutes)
          for i in {1..24}; do
            status=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --json mergeable -q .mergeable)
            if [ "$status" = "MERGEABLE" ]; then
              gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
              break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}
