name: Update TheBoringNotch Cask

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep -m 1 'version' Casks/theboringnotch.rb | cut -d '"' -f 2)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest version
        id: fetch-release
        run: |
          RELEASE_INFO=$(curl -s "https://api.github.com/repos/TheBoredTeam/boring.notch/releases/latest")
          VERSION=$(echo "$RELEASE_INFO" | jq -r .tag_name)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and calculate SHA256
        if: steps.current.outputs.version != steps.fetch-release.outputs.version
        id: download
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          
          # Convert version to CamelCase for DMG filename
          DMG_VERSION=$(echo "$VERSION" | awk -F'-' '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1))substr($i,2)}}1' | tr -d ' ')
          
          # Get download URL and calculate SHA256
          APP_URL="https://github.com/TheBoredTeam/boring.notch/releases/download/${VERSION}/${DMG_VERSION}.dmg"
          APP_SHA256=$(curl -sL "$APP_URL" | sha256sum | cut -d ' ' -f 1)
          
          echo "sha256=$APP_SHA256" >> $GITHUB_OUTPUT

      - name: Delete old branches
        if: steps.current.outputs.version != steps.fetch-release.outputs.version
        run: |
          git branch -r | grep 'origin/theboringnotch-' | while read -r branch; do
            branch=${branch#origin/}
            git push origin --delete "$branch"
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Update Cask and README
        if: steps.current.outputs.version != steps.fetch-release.outputs.version
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          SHA256="${{ steps.download.outputs.sha256 }}"
          
          # Update version in Cask
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/theboringnotch.rb
          
          # Update sha256 in Cask
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/theboringnotch.rb
          
          # Update README version
          sed -i "s/\`TheBoringNotch\`.*|\s*\`[^']*\`\s*|/\`TheBoringNotch\` | \`${VERSION}\` |/" README.md

      - name: Create Pull Request
        if: steps.current.outputs.version != steps.fetch-release.outputs.version
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update TheBoringNotch to version ${{ steps.fetch-release.outputs.version }}"
          title: "Update TheBoringNotch to version ${{ steps.fetch-release.outputs.version }}"
          body: |
            Automated update of TheBoringNotch to version ${{ steps.fetch-release.outputs.version }}
            
            - Updated version to ${{ steps.fetch-release.outputs.version }}
            - Updated SHA256 checksum
            - Updated version in README.md
          branch: theboringnotch-${{ steps.fetch-release.outputs.version }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.current.outputs.version != steps.fetch-release.outputs.version && steps.cpr.outputs.pull-request-number
        run: |
          # Wait for status checks to complete (max 2 minutes)
          for i in {1..24}; do
            status=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --json mergeable -q .mergeable)
            if [ "$status" = "MERGEABLE" ]; then
              gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
              break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }} 