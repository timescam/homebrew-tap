name: theboringnotch

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep -m 1 'version' Casks/theboringnotch.rb | cut -d '"' -f 2)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest version and download URL
        id: fetch-release
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.PAT }}" "https://api.github.com/repos/TheBoredTeam/boring.notch/releases")
          VERSION=$(echo "$RELEASE_INFO" | jq -r .[0].tag_name)
          
          # Check if the version is null or empty
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Invalid version detected. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "download_url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Extract the download URL for the DMG asset
          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.[0].assets[] | select(.content_type == "application/x-apple-diskimage" or .content_type == "application/x-diskcopy" or (.name | test("\\.dmg$"))) | .browser_download_url' | head -n 1)
          
          # Check if download URL was found
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: No DMG asset found in the latest release. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "download_url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - name: Download and calculate SHA256
        if: steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null'
        id: download
        run: |
          DOWNLOAD_URL="${{ steps.fetch-release.outputs.download_url }}"
          
          # Calculate SHA256 from the download URL
          APP_SHA256=$(curl -sL "$DOWNLOAD_URL" | sha256sum | cut -d ' ' -f 1)
          
          echo "sha256=$APP_SHA256" >> $GITHUB_OUTPUT

      - name: Delete old branches
        if: steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null'
        run: |
          git branch -r | grep 'origin/theboringnotch-' | while read -r branch; do
            branch=${branch#origin/}
            git push origin --delete "$branch"
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Update Cask and README
        if: steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null'
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          SHA256="${{ steps.download.outputs.sha256 }}"
          DOWNLOAD_URL="${{ steps.fetch-release.outputs.download_url }}"
          
          # Update version in Cask
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/theboringnotch.rb
          
          # Update sha256 in Cask
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/theboringnotch.rb
          
          # Update download URL in Cask (replace the entire url line)
          sed -i "s|url \".*\"|url \"${DOWNLOAD_URL}\"|" Casks/theboringnotch.rb
          
          # Update README version
          sed -i "s/\`TheBoringNotch\`.*|\s*\`[^']*\`\s*|/\`TheBoringNotch\` | \`${VERSION}\` |/" README.md

      - name: Create Pull Request
        if: steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null'
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update TheBoringNotch to version ${{ steps.fetch-release.outputs.version }}"
          title: "Update TheBoringNotch to version ${{ steps.fetch-release.outputs.version }}"
          body: |
            Automated update of TheBoringNotch to version ${{ steps.fetch-release.outputs.version }}
            
            - Updated version to ${{ steps.fetch-release.outputs.version }}
            - Updated SHA256 checksum
            - Updated download URL to ${{ steps.fetch-release.outputs.download_url }}
            - Updated version in README.md
          branch: theboringnotch-${{ steps.fetch-release.outputs.version }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null' && steps.cpr.outputs.pull-request-number
        run: |
          # Wait for status checks to complete (max 2 minutes)
          for i in {1..24}; do
            status=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --json mergeable -q .mergeable)
            if [ "$status" = "MERGEABLE" ]; then
              gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
              break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }} 