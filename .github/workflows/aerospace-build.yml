name: aerospace-build-nightly

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  build-aerospace:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcbeautify fish bash

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Clone AeroSpace source
        run: |
          git clone https://github.com/nikitabobko/AeroSpace.git AeroSpace

      - name: Build AeroSpace
        working-directory: AeroSpace
        run: |
          # Use ad-hoc signing (-) since we don't have the developer certificate
          ./build-release.sh --build-version nightly --codesign-identity -

      - name: Find and prepare artifact
        id: prepare-artifact
        run: |
          ZIP_PATH=$(find AeroSpace/.release -name "AeroSpace-vnightly.zip" | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "Error: No ZIP artifact found in .release directory"
            exit 1
          fi
          echo "Found artifact: $ZIP_PATH"
          cp "$ZIP_PATH" ./AeroSpace-vnightly.zip
          echo "archive_name=AeroSpace-vnightly.zip" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: aerospace-nightly
          name: AeroSpace Nightly Build ${{ steps.date.outputs.date }}
          body: |
            Automated nightly build of AeroSpace from main branch.

            Built on: ${{ steps.date.outputs.date }}
            Architecture: Universal (ARM64 & x86_64)

            This is an automated build from the latest main branch. Use at your own risk.
            Ad-hoc signed (-). You may need to remove the quarantine attribute after installation.
          draft: false
          prerelease: true
          files: ./${{ steps.prepare-artifact.outputs.archive_name }}
