name: audacity-build-nightly

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  build-audacity:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d
          cache: true

      - name: Install dependencies
        run: brew install cmake ninja pkg-config

      - name: Clone Audacity source
        run: |
          git clone --recurse-submodules https://github.com/audacity/audacity.git audacity-source

      - name: Build Audacity
        working-directory: audacity-source
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=output \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DAU4_BUILD_MODE=dev
          cmake --build build
          cmake --install build

      - name: Bundle Qt frameworks with macdeployqt
        working-directory: audacity-source
        run: |
          APP_PATH=$(find output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in output directory for macdeployqt"
            exit 1
          fi
          macdeployqt "$APP_PATH" -qmldir="$QT_ROOT_DIR/qml" -always-overwrite

      - name: Re-sign app bundle
        working-directory: audacity-source
        run: |
          APP_PATH=$(find output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found for re-signing"
            exit 1
          fi
          # Inside-out signing avoids "Code Signature Invalid" / Invalid Page when launching:
          # sign nested frameworks and libraries first, then the main app.
          # (--deep can sign in wrong order and leave nested code invalid.)
          while IFS= read -r fw; do
            codesign --force --sign - "$fw"
          done < <(find "$APP_PATH" -name "*.framework" -type d | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP_PATH"

      - name: Find and prepare app bundle
        id: prepare-app
        run: |
          APP_PATH=$(find audacity-source/output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in output directory"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          echo "Found app: $APP_NAME at $APP_PATH"

          # Create a temporary directory for DMG creation
          TEMP_DIR=$(mktemp -d)
          ditto "$APP_PATH" "$TEMP_DIR/$APP_NAME"

          # Create DMG file
          DMG_NAME="audacity-macOS-nightly-arm64.dmg"
          hdiutil create -volname "Audacity Nightly" -srcfolder "$TEMP_DIR" -ov -format UDZO "$DMG_NAME"

          # Clean up temporary directory
          rm -rf "$TEMP_DIR"

          echo "app_path=${APP_PATH}" >> $GITHUB_OUTPUT
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "archive_name=${DMG_NAME}" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audacity-nightly
          name: Audacity Nightly Build ${{ steps.date.outputs.date }}
          body: |
            Automated nightly build of Audacity from master branch.

            Built on: ${{ steps.date.outputs.date }}
            Architecture: ARM64 (Apple Silicon)

            This is an automated build from the latest master branch. Use at your own risk.
          draft: false
          prerelease: true
          files: ./${{ steps.prepare-app.outputs.archive_name }}
