name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - atoll
          - gopeed-web
          - imfile
          - koharu
          - localsend-go
          - motrix-next
          - "musicbrainz-picard@3"
          - pay-respects
          - pokeget
          - spotatui
          - zagi
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Bump ${{ matrix.package }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr "$TAP_NAME/${{ matrix.package }}"

  merge:
    needs: autobump
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge brew bump PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "github-actions[bot]" --json number --jq '.[].number')
          for n in $prs; do
            gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --auto --merge || true
          done
