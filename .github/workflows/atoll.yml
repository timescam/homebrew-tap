name: atoll

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep -m 1 'version' Casks/atoll.rb | cut -d '"' -f 2)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest version and download URL
        id: fetch-release
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.PAT }}" "https://api.github.com/repos/Ebullioscopic/Atoll/releases")
          RELEASE=$(echo "$RELEASE_INFO" | jq -c '[.[] | select(.draft == false and .prerelease == false)][0]')
          VERSION=$(echo "$RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          DMG_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -n 1)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ] || [ -z "$DMG_URL" ] || [ "$DMG_URL" = "null" ]; then
            echo "Error: Invalid stable release metadata detected. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "dmg_url=" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dmg_url=$DMG_URL" >> $GITHUB_OUTPUT

      - name: Download and calculate SHA256
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: download
        run: |
          DMG_URL="${{ steps.fetch-release.outputs.dmg_url }}"
          SHA256=$(curl -sL "$DMG_URL" | sha256sum | cut -d ' ' -f 1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Delete old branches
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          git branch -r | grep 'origin/atoll-' | while read -r branch; do
            branch=${branch#origin/}
            git push origin --delete "$branch"
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Update Cask and README
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          SHA256="${{ steps.download.outputs.sha256 }}"

          perl -i -pe 's/^(\s*version\s+)".+?"/$1"$ENV{VERSION}"/ if !$done++ && /version/' Casks/atoll.rb
          perl -i -pe 's/^(\s*sha256\s+)".+?"/$1"$ENV{SHA256}"/' Casks/atoll.rb
          perl -i -pe 's/(\| `atoll`\s+\| `)([^`]+)(`\s*\|)/$1$ENV{VERSION}$3/ if /atoll/' README.md

      - name: Create Pull Request
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update atoll to version ${{ steps.fetch-release.outputs.version }}"
          title: "Update atoll to version ${{ steps.fetch-release.outputs.version }}"
          body: |
            Automated update of atoll to version ${{ steps.fetch-release.outputs.version }}

            - Updated version to ${{ steps.fetch-release.outputs.version }}
            - Updated SHA256 checksum to ${{ steps.download.outputs.sha256 }}
            - Updated download URL to ${{ steps.fetch-release.outputs.dmg_url }}
            - Updated version in README.md
          branch: atoll-${{ steps.fetch-release.outputs.version }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: ((steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch') && steps.cpr.outputs.pull-request-number
        run: |
          # Wait for status checks to complete (max 2 minutes)
          for i in {1..24}; do
            status=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --json mergeable -q .mergeable)
            if [ "$status" = "MERGEABLE" ]; then
              gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
              break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}
