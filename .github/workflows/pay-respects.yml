name: pay-respects

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0  # Need history to check current version

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep -m 1 'version' Formula/pay-respects.rb | cut -d '"' -f 2)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest version and download URLs
        id: fetch-release
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.PAT }}" "https://api.github.com/repos/iffse/pay-respects/releases")
          # Skip the moving "nightly" release and target the latest versioned release
          LATEST=$(echo "$RELEASE_INFO" | jq -c '[.[] | select(.tag_name != "nightly")][0]')
          VERSION=$(echo "$LATEST" | jq -r .tag_name | sed 's/^v//')
          
          # Check if the version is null or empty
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Invalid version detected. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "arm_url=" >> $GITHUB_OUTPUT
            echo "x86_url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Extract download URLs and SHA256 digests for ARM and x86 assets
          ARM_URL=$(echo "$LATEST" | jq -r '.assets[] | select(.name | test("aarch64-apple-darwin\\.tar\\.zst$")) | .browser_download_url' | head -n 1)
          X86_URL=$(echo "$LATEST" | jq -r '.assets[] | select(.name | test("x86_64-apple-darwin\\.tar\\.zst$")) | .browser_download_url' | head -n 1)
          ARM_SHA256=$(echo "$LATEST" | jq -r '.assets[] | select(.name | test("aarch64-apple-darwin\\.tar\\.zst$")) | .digest | sub("sha256:"; "")' | head -n 1)
          X86_SHA256=$(echo "$LATEST" | jq -r '.assets[] | select(.name | test("x86_64-apple-darwin\\.tar\\.zst$")) | .digest | sub("sha256:"; "")' | head -n 1)
          
          # Check if download URLs were found
          if [ -z "$ARM_URL" ] || [ "$ARM_URL" = "null" ] || [ -z "$X86_URL" ] || [ "$X86_URL" = "null" ]; then
            echo "Error: Required assets not found in the latest release. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "arm_url=" >> $GITHUB_OUTPUT
            echo "x86_url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arm_url=$ARM_URL" >> $GITHUB_OUTPUT
          echo "x86_url=$X86_URL" >> $GITHUB_OUTPUT
          echo "arm_sha256=$ARM_SHA256" >> $GITHUB_OUTPUT
          echo "x86_sha256=$X86_SHA256" >> $GITHUB_OUTPUT

      - name: Delete old branches
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          git branch -r | grep 'origin/pay-respects-' | while read -r branch; do
            branch=${branch#origin/}
            git push origin --delete "$branch"
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Update Formula and README
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          ARM_SHA256="${{ steps.fetch-release.outputs.arm_sha256 }}"
          X86_SHA256="${{ steps.fetch-release.outputs.x86_sha256 }}"
          ARM_URL="${{ steps.fetch-release.outputs.arm_url }}"
          X86_URL="${{ steps.fetch-release.outputs.x86_url }}"
          
          # Update version in Formula
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/pay-respects.rb
          
          # Update ARM SHA256
          sed -i "/on_arm do/,/end/ s/sha256 \".*\"/sha256 \"${ARM_SHA256}\"/" Formula/pay-respects.rb
          
          # Update x86 SHA256
          sed -i "/on_intel do/,/end/ s/sha256 \".*\"/sha256 \"${X86_SHA256}\"/" Formula/pay-respects.rb
          
          # Update ARM URL
          sed -i "/on_arm do/,/end/ s|url \".*\"|url \"${ARM_URL}\"|" Formula/pay-respects.rb
          
          # Update x86 URL
          sed -i "/on_intel do/,/end/ s|url \".*\"|url \"${X86_URL}\"|" Formula/pay-respects.rb
          
          # Update README version
          sed -i "s/\`pay-respects\`.*|\s*\`[0-9.]*\`\s*|/\`pay-respects\` | \`${VERSION}\` |/" README.md

      - name: Create Pull Request
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update pay-respects to version ${{ steps.fetch-release.outputs.version }}"
          title: "Update pay-respects to version ${{ steps.fetch-release.outputs.version }}"
          body: |
            Automated update of pay-respects to version ${{ steps.fetch-release.outputs.version }}
            
            - Updated version to ${{ steps.fetch-release.outputs.version }}
            - Updated SHA256 checksums for both ARM and x86_64 builds
            - Updated download URLs to ${{ steps.fetch-release.outputs.arm_url }} and ${{ steps.fetch-release.outputs.x86_url }}
            - Updated version in README.md
          branch: pay-respects-${{ steps.fetch-release.outputs.version }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: ((steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch') && steps.cpr.outputs.pull-request-number
        run: |
          # Wait for status checks to complete (max 2 minutes)
          for i in {1..24}; do
            status=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --json mergeable -q .mergeable)
            if [ "$status" = "MERGEABLE" ]; then
              gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
              break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }} 