name: localsend-go

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(grep -m 1 'version' Formula/localsend-go.rb | cut -d '"' -f 2)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest version and download URLs
        id: fetch-release
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.PAT }}" "https://api.github.com/repos/meowrain/localsend-go/releases")
          VERSION=$(echo "$RELEASE_INFO" | jq -r .[0].tag_name | sed 's/^v//')
          
          # Check if the version is null or empty
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Invalid version detected. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "arm_url=" >> $GITHUB_OUTPUT
            echo "x86_url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Extract download URLs for ARM and x86 binary assets
          ARM_URL=$(echo "$RELEASE_INFO" | jq -r '.[0].assets[] | select(.name | test("darwin-arm64$")) | .browser_download_url' | head -n 1)
          X86_URL=$(echo "$RELEASE_INFO" | jq -r '.[0].assets[] | select(.name | test("darwin-amd64$")) | .browser_download_url' | head -n 1)
          
          # Check if download URLs were found
          if [ -z "$ARM_URL" ] || [ "$ARM_URL" = "null" ] || [ -z "$X86_URL" ] || [ "$X86_URL" = "null" ]; then
            echo "Error: Required binary assets not found in the latest release. Aborting workflow." >&2
            echo "version=" >> $GITHUB_OUTPUT
            echo "arm_url=" >> $GITHUB_OUTPUT
            echo "x86_url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arm_url=$ARM_URL" >> $GITHUB_OUTPUT
          echo "x86_url=$X86_URL" >> $GITHUB_OUTPUT

      - name: Download and calculate SHA256
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: download
        run: |
          ARM_URL="${{ steps.fetch-release.outputs.arm_url }}"
          X86_URL="${{ steps.fetch-release.outputs.x86_url }}"
          
          # Calculate SHA256 from the download URLs
          ARM_SHA256=$(curl -sL "$ARM_URL" | sha256sum | cut -d ' ' -f 1)
          X86_SHA256=$(curl -sL "$X86_URL" | sha256sum | cut -d ' ' -f 1)
          
          echo "arm_sha256=$ARM_SHA256" >> $GITHUB_OUTPUT
          echo "x86_sha256=$X86_SHA256" >> $GITHUB_OUTPUT

      - name: Delete old branches
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          git branch -r | grep 'origin/localsend-go-' | while read -r branch; do
            branch=${branch#origin/}
            git push origin --delete "$branch"
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Update Formula and README
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"
          ARM_SHA256="${{ steps.download.outputs.arm_sha256 }}"
          X86_SHA256="${{ steps.download.outputs.x86_sha256 }}"
          ARM_URL="${{ steps.fetch-release.outputs.arm_url }}"
          X86_URL="${{ steps.fetch-release.outputs.x86_url }}"
          
          # Update version in Formula
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/localsend-go.rb
          
          # Update ARM SHA256 and URL
          sed -i "/on_arm do/,/sha256/ s/sha256 \".*\"/sha256 \"${ARM_SHA256}\"/" Formula/localsend-go.rb
          sed -i "/on_arm do/,/end/ s|url \".*\"|url \"${ARM_URL}\"|" Formula/localsend-go.rb
          
          # Update x86 SHA256 and URL
          sed -i "/on_intel do/,/sha256/ s/sha256 \".*\"/sha256 \"${X86_SHA256}\"/" Formula/localsend-go.rb
          sed -i "/on_intel do/,/end/ s|url \".*\"|url \"${X86_URL}\"|" Formula/localsend-go.rb
          
          # Update README version
          sed -i "s/\`localsend-go\`.*|\s*\`[0-9.]*\`\s*|/\`localsend-go\` | \`${VERSION}\` |/" README.md

      - name: Create Pull Request
        if: (steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch'
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update localsend-go to version ${{ steps.fetch-release.outputs.version }}"
          title: "Update localsend-go to version ${{ steps.fetch-release.outputs.version }}"
          body: |
            Automated update of localsend-go to version ${{ steps.fetch-release.outputs.version }}
            
            - Updated version to ${{ steps.fetch-release.outputs.version }}
            - Updated SHA256 checksums for both ARM and x86_64 builds
            - Updated download URLs to ${{ steps.fetch-release.outputs.arm_url }} and ${{ steps.fetch-release.outputs.x86_url }}
            - Updated version in README.md
          branch: localsend-go-${{ steps.fetch-release.outputs.version }}
          delete-branch: true

      - name: Enable Auto-Merge
        if: ((steps.current.outputs.version != steps.fetch-release.outputs.version && steps.fetch-release.outputs.version != '' && steps.fetch-release.outputs.version != 'null') || github.event_name == 'workflow_dispatch') && steps.cpr.outputs.pull-request-number
        run: |
          # Wait for status checks to complete (max 2 minutes)
          for i in {1..24}; do
            status=$(gh pr view "${{ steps.cpr.outputs.pull-request-number }}" --json mergeable -q .mergeable)
            if [ "$status" = "MERGEABLE" ]; then
              gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
              break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.PAT }}